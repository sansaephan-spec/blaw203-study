<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1'><meta name='apple-mobile-web-app-capable' content='yes'><title>BLAW 203 Study</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;margin:0;background:#f3f5f8;color:#152033}.wrap{max-width:700px;margin:auto;padding:18px}.top{text-align:center}.card{background:white;border-radius:22px;min-height:260px;box-shadow:0 6px 22px #0002;padding:28px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:28px;font-weight:700;margin:20px 0}.small{font-size:16px;color:#586273}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:0;border-radius:14px;padding:16px;font-size:18px;font-weight:700;background:#153d6f;color:white}.secondary{background:#e4e9ef;color:#152033}.good{background:#247a3c}.bad{background:#a73535}.quiz{display:none}.choice{width:100%;margin:6px 0;text-align:left}.score{font-weight:700;margin:10px 0}.note{font-size:14px;color:#586273;margin-top:18px}</style></head><body><div class='wrap'><div class='top'><h1>BLAW 203 Exam Study</h1><div class='small'>Ch. 1, 3, 4, 5 + Precedent • Chapter 2 omitted</div></div><div id='flash'><div id='card' class='card' onclick='flip()'></div><div class='buttons'><button class='secondary' onclick='prev()'>← Previous</button><button onclick='flip()'>Flip Card</button><button class='bad' onclick='mark(false)'>Need Practice</button><button class='good' onclick='mark(true)'>I Know It ✓</button></div><p class='score' id='progress'></p><button style='width:100%' onclick='startQuiz()'>Start Multiple-Choice Quiz</button></div><div id='quiz' class='quiz'><div class='score' id='qscore'></div><div id='qcard' class='card'></div><div id='choices'></div><button class='secondary' style='width:100%;margin-top:12px' onclick='showFlash()'>Back to Flashcards</button></div><p class='note'>Safety: use this interactively while parked, standing in line, or during free time. While driving, use hands-free audio only—do not look at or tap the screen.</p></div><script>
const cards=[
['Highest law in the U.S.?','Constitution'],['Legislative, Executive, Judicial branches?','Separation of powers'],['Court reviews whether government action is constitutional?','Judicial review'],['Division of power between state and federal governments?','Federalism'],['Law passed by a legislature?','Statute'],['Earlier court decision used as authority?','Precedent'],['Court where the case is originally heard?','Trial court'],['Court that reviews a lower court?','Appeals court'],['Federal trial court?','District Court'],['Federal appeals court?','Circuit Court'],['California trial court?','Superior Court'],['Remedy seeking money damages?','Law'],['Court order requiring or stopping an action?','Equity / Injunction'],['Person who brings a civil lawsuit?','Plaintiff'],['Person being sued?','Defendant'],["Person's legal right to bring a lawsuit?",'Standing'],["Court's power over the TYPE of case?",'Subject Matter Jurisdiction'],["Court's power over a PERSON?",'Personal Jurisdiction'],['Enough connection with another state?','Minimum Contacts'],['Proper geographic place for a lawsuit?','Venue'],['Document that starts a lawsuit?','Complaint'],["Defendant's response to a complaint?",'Answer'],['“So what? The complaint is legally insufficient.”','Demurrer'],['Written questions during discovery?','Interrogatories'],['“Admit or deny this fact.”','Request for Admission'],['“Give me these documents.”','Request for Production'],['Questions answered under oath before trial?','Deposition'],['No genuine factual dispute requiring a trial?','Summary Judgment'],['Juror removed because of bias?','Challenge for Cause'],['Juror challenge with no cause stated?','Peremptory Challenge'],['Normal burden of proof in a civil case?','Preponderance of the evidence'],['Burden of proof for fraud?','Clear and convincing evidence'],['Burden of proof in a criminal case?','Beyond a reasonable doubt'],["Jury's decision?",'Verdict'],['Decision entered by the judge?','Judgment'],["Appeals court keeps lower court's decision?",'Affirm'],["Appeals court overturns lower court's decision?",'Reverse'],['Appeals court sends case back to lower court?','Remand'],['Neutral person HELPS parties reach agreement?','Mediation'],['Neutral person DECIDES the dispute?','Arbitration'],["Arbitrator's decision?",'Award'],['Standing vs. jurisdiction?','Standing = person’s right to sue; jurisdiction = court’s power.'],['Subject matter vs. personal jurisdiction?','Subject matter = type of case; personal = person.'],['Jurisdiction vs. venue?','Jurisdiction = POWER; venue = PLACE.'],['Plaintiff vs. defendant?','Plaintiff SUES; defendant GETS SUED.'],['Complaint vs. answer?','Complaint = START; answer = RESPONSE.'],['Interrogatory vs. deposition?','Interrogatory = written; deposition = questions under oath.'],['Trial vs. appeal?','Trial = evidence/witnesses; appeal = review, no new evidence.'],['Verdict vs. judgment?','Verdict = JURY; judgment = JUDGE.'],['Mediation vs. arbitration?','Mediation = HELPER; arbitration = DECIDER.'],['Affirm vs. reverse vs. remand?','Affirm = KEEP; reverse = OVERTURN; remand = SEND BACK.']];
let i=0,back=false,known=JSON.parse(localStorage.getItem('blawKnown')||'{}'); function render(){card.textContent=back?cards[i][1]:cards[i][0];progress.textContent=`Card ${i+1} of ${cards.length} • Known: ${Object.values(known).filter(Boolean).length}`}; function flip(){back=!back;render()} function prev(){i=(i-1+cards.length)%cards.length;back=false;render()} function mark(v){known[i]=v;localStorage.setItem('blawKnown',JSON.stringify(known));i=(i+1)%cards.length;back=false;render()}
let qi=0,correct=0,order=[];function startQuiz(){flash.style.display='none';quiz.style.display='block';correct=0;qi=0;order=[...Array(cards.length).keys()].sort(()=>Math.random()-.5);ask()}function ask(){if(qi>=order.length){qcard.textContent=`Finished! ${correct}/${order.length} correct.`;choices.innerHTML='';qscore.textContent='Quiz complete';return}let idx=order[qi],ans=cards[idx][1],opts=[ans];while(opts.length<4){let a=cards[Math.floor(Math.random()*cards.length)][1];if(!opts.includes(a))opts.push(a)}opts.sort(()=>Math.random()-.5);qcard.textContent=cards[idx][0];qscore.textContent=`Question ${qi+1}/${order.length} • Score ${correct}`;choices.innerHTML=opts.map(x=>`<button class='choice' onclick='answer(${JSON.stringify(x)},${JSON.stringify(ans)})'>${x}</button>`).join('')}function answer(x,a){if(x===a)correct++;else known[order[qi]]=false;qi++;ask()}function showFlash(){quiz.style.display='none';flash.style.display='block';render()}render();
</script></body></html>
